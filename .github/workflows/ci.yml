name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  motor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # O node NAO e detalhe do ambiente de teste: e o runtime da imagem de
      # producao (node:24-slim no Dockerfile). O CI so tinha bun, e foi por isso
      # que a Onda 11 mergeou verde com uma imagem que morria no arranque —
      # o bun resolve import relativo sem extensao e o node nao.
      # Pinado na MESMA major do Dockerfile de proposito: divergir aqui traria
      # de volta exatamente a cegueira que este job existe para eliminar.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint:types
      - run: bun run lint:clone
      - run: bun run test:unit
      # A MESMA suite sob node puro, e obrigatoria. Ate aqui o node so via um
      # `--help`: a suite rodava so sob bun e, por construcao, nao enxergava o que
      # quebra no outro runtime — foi assim que a Onda 11 mergeou verde com uma
      # imagem que morria no arranque. Agora os dois runtimes executam os mesmos
      # 2540 testes, e `test/apoio/migracao-node-test.test.ts` impede que um
      # arquivo volte a depender de `bun:` sem reprovar.
      - run: bun run test:node
      # Fumaca sob node puro no binario de verdade, que exercita o caminho de
      # arranque (resolucao de import, shebang, argv) que a suite nao cobre.
      - run: node bin/hii.ts --help
