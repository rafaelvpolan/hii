# Docker Swarm. Deploy:
#   docker build -t <registry>/hii:<tag> .
#   docker push <registry>/hii:<tag>
#   HII_IMAGEM=<registry>/hii:<tag> docker stack deploy -c docker-stack.yml hii
#
# COMPOSE E PROIBIDO NESTE PROJETO — ver config/regras-inegociaveis.json (r-0001)
# e test/cordel/sem-compose.test.ts, que reprova a suite. O motivo e tecnico: em
# compose o bloco `deploy.resources.limits` abaixo e IGNORADO, e o teto de cpu e
# memoria do item 32 viraria decorativo. Teto decorativo e pior que teto nenhum,
# porque parece que existe.
#
# `build:` num stack de swarm nao e recusado: o deploy imprime "Ignoring
# unsupported options: build" e SOBE ASSIM MESMO, com exit 0 (verificado em
# docker 29.6). Quem escrever build: aqui acha que construiu e publicou a imagem
# velha — ignorar em silencio e pior que recusar, e e por isso que quem barra e
# o teste (test/cordel/sem-compose.test.ts), nao o docker. A imagem vem pronta de um
# registry, o que tambem obriga a versionar o que esta em producao.
version: "3.9"

services:
  hii:
    image: ${HII_IMAGEM:?defina HII_IMAGEM com a imagem publicada}
    environment:
      HICODE_RUNTIME: ${HICODE_RUNTIME:-node}
      # Onda 5, itens 5/22/4: LIGADO. As tres exigencias que so BARRAM com este
      # interruptor sao RED antes do GREEN no perfil completo (`red_antes_do_green`),
      # comando de teste no contrato quando a area e nova (`setup_ferramental`) e
      # matriz de entendimento respondida antes de aprovar o plano
      # (`matriz_entendimento`). Desligado elas ja escreviam o veredicto no card, o que
      # tornava visivel quem passava sem provar — e nunca barrava ninguem.
      #
      # Ficou desligado por padrao no codigo (motor/cordel/alicerce/config.ts) porque
      # "ligar hoje pararia todo trabalho em voo", e isso deixou de valer: ligar aqui
      # vale a partir do proximo deploy, que e o momento que o operador escolhe.
      #
      # O que mudou para ser seguro: o item 5 cobrava a coisa errada enquanto a
      # consulta rodava ANTES do produtor da evidencia, e todo card `completo` fazia
      # HALT mesmo com TDD real. Hoje `registrarRed` roda dentro de `testGate`
      # (motor/ciclo/crivo/portoes-de-fecho.ts:97), a consulta vem depois
      # (motor/quilombo/cartorio/fechar.ts:295) e ha um segundo produtor a partir do
      # relato do agente (`:278`).
      #
      # Saida de emergencia: `HICODE_RIGOR_ESTRITO=0 docker stack deploy ...`.
      HICODE_RIGOR_ESTRITO: ${HICODE_RIGOR_ESTRITO:-1}
      # Item 32: estes numeros e o bloco deploy.resources.limits precisam contar
      # a mesma historia. O swarm impoe o teto; o motor le os mesmos valores para
      # decidir quantos worktrees abre em paralelo. Quem le: orcamentoDeRecurso e
      # quantosWorktreesCabem em motor/quilombo/limites.ts, aplicados pelo escalonador
      # em motor/oswaldo/mutirao/fila.ts (tetoDeParalelismo). Enquanto nao havia esse
      # ultimo elo, este comentario afirmava com file:line uma leitura que nao
      # acontecia — o escalonador usava so HICODE_CONCURRENCY e abria 3 worktrees
      # de 2048MB contra o limite de 4096MB.
      HICODE_MEM_TOTAL_MB: "4096"
      HICODE_CPUS_TOTAL: "2"
      HICODE_MEM_POR_WORKTREE_MB: "2048"
      HICODE_CPU_POR_WORKTREE: "1"
      # Item 29: o caminho sempre-funcional e variavel de ambiente. Em swarm o
      # segredo entra como ARQUIVO em /run/secrets/<nome>, e o provedor de
      # arquivo le de la — cofre opcional e plugavel, nunca hard-requirement.
      HICODE_SECRETS_DIR: /run/secrets
    secrets:
      - anthropic_api_key
      - gh_token
    volumes:
      # Item 31: estado fora do container. Cards, diario e worktrees sobrevivem
      # a `docker stack rm`. skills/ e config/ vivem em git, nunca so aqui.
      - estado:/estado
      # O harness de IA e a credencial dele entram montados — ver Dockerfile.
      - harness:/root/.claude:ro
    # /health NAO e publicado de proposito: nao tem autenticacao, e swarm nao
    # sabe ligar so no loopback. Alcance por `docker exec` ou por um coletor
    # dentro da rede overlay.
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        order: stop-first
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 1G

secrets:
  anthropic_api_key:
    external: true
  gh_token:
    external: true

volumes:
  estado:
  harness:
